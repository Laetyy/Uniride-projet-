{% extends "base.html" %}

{% block content %}
<h2>Mon Profil</h2>

<div class="profile-card">
    <label>Nom utilisateur</label>
    <input type="text" id="nom_utilisateur">

    <label>Email</label>
    <input type="email" id="email">

    <label>Rôle</label>
    <input type="text" id="role" disabled>
</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    document.body.innerHTML = "<h2>Accès refusé</h2><p>Veuillez vous connecter.</p>";
} else {
    document.getElementById("nom_utilisateur").value = user.nom_utilisateur || "";
    document.getElementById("email").value = user.email || "";
    document.getElementById("role").value = user.role || "";
}

const phtotoInput = document.getElementById("photo-input");
const photoPreview = document.getElementById("photo-preview");

phtotoInput.addEventListener("change", function() {
    const file = this.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            photoPreview.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }
});

document.getElementById("upload-btn").addEventListener("click", function() {
    document.getElementById("upload-btn").addEventListener("click", function () {
    alert("Pour l’instant, la photo est affichée seulement en aperçu. On connectera l’upload au backend après.");
});
});
    
</script>
{% endblock %}
