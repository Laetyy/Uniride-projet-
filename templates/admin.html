{% extends "base.html" %}

{% block content %}
<h2 class="admin-page-title">Administration UniRide</h2>

<!-- MENU -->
<div class="admin-tabs">
    <button onclick="showSection('stats')">Statistiques</button>
    <button onclick="showSection('users')">Utilisateurs</button>
    <button onclick="showSection('demandes')">Demandes</button>
    <button onclick="showSection('trajets')">Trajets</button>
    <button onclick="showSection('wallets')">Wallets</button>
</div>

<div class="admin-content">
    <div id="section-stats" class="admin-section"></div>
    <div id="section-users" class="admin-section hidden"></div>
    <div id="section-demandes" class="admin-section hidden"></div>
    <div id="section-trajets" class="admin-section hidden"></div>
    <div id="section-wallets" class="admin-section hidden"></div>
</div>

<script>

// =============================
// NAVIGATION
// =============================
function showSection(section) {
    document.querySelectorAll(".admin-section").forEach(sec => {
        sec.classList.add("hidden");
    });
    document.getElementById("section-" + section).classList.remove("hidden");
}

// =============================
// PROFIL UTILISATEUR
// =============================
function voirProfil(id_utilisateur) {
    window.location.href = `/profil-conducteur-page?id=${id_utilisateur}`;
}

// =============================
// SECURITE
// =============================
async function verifierAdmin() {
    const res = await fetch("/me");
    const data = await res.json();

    if (!data.user || data.user.role !== "admin") {
        window.location.href = "/home";
        return false;
    }
    return true;
}

// =============================
// STATS
// =============================
async function chargerStatsAdmin() {
    const zone = document.getElementById("section-stats");
    const res = await fetch("/admin/stats");
    const stats = await res.json();

    zone.innerHTML = `
        <div class="dashboard-card">
            <h3>Statistiques globales</h3>
            <p>👤 Utilisateurs : ${stats.total_utilisateurs}</p>
            <p>🚗 Conducteurs : ${stats.total_conducteurs}</p>
            <p>🛣️ Trajets : ${stats.total_trajets}</p>
            <p>📦 Réservations : ${stats.total_reservations}</p>
            <p>⏳ Demandes en attente : ${stats.demandes_en_attente}</p>
        </div>
    `;
}

// =============================
// UTILISATEURS (DETAILS + PROFIL)
// =============================
async function chargerUtilisateurs() {
    const zone = document.getElementById("section-users");
    const res = await fetch("/admin/utilisateurs");
    const users = await res.json();

    // 🔥 séparation
    const actifs = users.filter(u => u.statut === "actif");
    const suspendus = users.filter(u => u.statut === "suspendu");

    zone.innerHTML = `
        <div class="admin-grid-2">
            <div>
                <h3>🟢 Utilisateurs actifs</h3>
                <div id="users-actifs"></div>
            </div>

            <div>
                <h3>🔴 Utilisateurs suspendus</h3>
                <div id="users-suspendus"></div>
            </div>
        </div>
    `;

    function render(list, containerId, isActif) {
        const container = document.getElementById(containerId);

        if (list.length === 0) {
            container.innerHTML = "<p>Aucun utilisateur.</p>";
            return;
        }

        list.forEach(u => {
            container.innerHTML += `
                <div class="trajet-card">
                    <h4>${u.nom_utilisateur}</h4>

                    <p><strong>Email :</strong> ${u.email}</p>
                    <p><strong>Téléphone :</strong> ${u.telephone || "Non renseigné"}</p>
                    <p><strong>Nom :</strong> ${u.nom || ""} ${u.prenom || ""}</p>

                    <p><strong>Rôle :</strong> ${u.role}</p>

                    <div class="home-actions">
                        <button class="btn" onclick="voirProfil(${u.id_utilisateur})">
                            👤 Profil
                        </button>

                        ${isActif ? `
                            <button class="btn secondary" onclick="suspendreUtilisateur(${u.id_utilisateur})">
                                Suspendre
                            </button>
                        ` : `
                            <button class="btn" onclick="reactiverUtilisateur(${u.id_utilisateur})">
                                Réactiver
                            </button>
                        `}
                    </div>
                </div>
            `;
        });
    }

    render(actifs, "users-actifs", true);
    render(suspendus, "users-suspendus", false);
}
// =============================
// DEMANDES
// =============================
async function chargerDemandes() {
    const zone = document.getElementById("section-demandes");
    const res = await fetch("/admin/demandes-certification");
    const demandes = await res.json();

    // 🔥 séparation
    const enAttente = demandes.filter(d => d.statut_demande === "en_attente");
    const acceptees = demandes.filter(d => d.statut_demande === "acceptee");
    const refusees = demandes.filter(d => d.statut_demande === "refusee");

    zone.innerHTML = `
        <div class="admin-grid-3">
            <div>
                <h3>⏳ Demandes en attente</h3>
                <div id="attente"></div>
            </div>

            <div>
                <h3>✅ Demandes acceptées</h3>
                <div id="acceptees"></div>
            </div>

            <div>
                <h3>❌ Demandes refusées</h3>
                <div id="refusees"></div>
            </div>
        </div>
    `;

    function render(d, containerId, isPending) {
        const container = document.getElementById(containerId);

        if (d.length === 0) {
            container.innerHTML = "<p>Aucune demande.</p>";
            return;
        }

        d.forEach(item => {
            container.innerHTML += `
                <div class="trajet-card">
                    <h4>${item.nom_utilisateur}</h4>

                    <p><strong>Email :</strong> ${item.email}</p>

                    <p><strong>Permis :</strong> ${item.numero_permis}</p>
                    <p><strong>Expiration :</strong> ${item.date_expiration_permis}</p>

                    <p><strong>Identité :</strong> ${item.type_identite}</p>
                    <p><strong>Numéro :</strong> ${item.numero_identite}</p>

                    <p><strong>Statut :</strong> ${item.statut_demande}</p>

                    ${item.commentaire_admin ? `
                        <p><strong>Commentaire :</strong> ${item.commentaire_admin}</p>
                    ` : ""}

                    ${isPending ? `
                        <div class="home-actions">
                            <button class="btn" onclick="accepterDemande(${item.id_demande})">
                                Accepter
                            </button>
                            <button class="btn secondary" onclick="refuserDemande(${item.id_demande})">
                                Refuser
                            </button>
                        </div>
                    ` : ""}
                </div>
            `;
        });
    }

    render(enAttente, "attente", true);
    render(acceptees, "acceptees", false);
    render(refusees, "refusees", false);
}
// =============================
// TRAJETS
// =============================
async function chargerTrajetsAdmin() {
    const zone = document.getElementById("section-trajets");
    const res = await fetch("/admin/trajets");
    const trajets = await res.json();

    // 🔥 séparation
    const actifs = trajets.filter(t => t.statut === "actif");
    const termines = trajets.filter(t => t.statut === "termine");

    zone.innerHTML = `
        <div class="admin-grid-2">

            <div>
                <h3>🟢 Trajets actifs</h3>
                <div id="trajets-actifs"></div>
            </div>

            <div>
                <h3>⚫ Trajets terminés</h3>
                <div id="trajets-termines"></div>
            </div>

        </div>
    `;

    function render(list, containerId) {
        const container = document.getElementById(containerId);

        if (list.length === 0) {
            container.innerHTML = "<p>Aucun trajet.</p>";
            return;
        }

        list.forEach(t => {
            container.innerHTML += `
                <div class="trajet-card">
                    <h4>${t.ville_depart} → ${t.ville_arrivee}</h4>

                    <p><strong>Conducteur :</strong> ${t.conducteur}</p>

                    <p><strong>Date :</strong> ${t.date_trajet}</p>
                    <p><strong>Heure :</strong> ${t.heure_trajet}</p>

                    <p><strong>Prix :</strong> ${t.prix}$</p>
                    <p><strong>Places :</strong> ${t.places_disponibles}</p>

                    <p><strong>Statut :</strong> ${t.statut}</p>
                </div>
            `;
        });
    }

    render(actifs, "trajets-actifs");
    render(termines, "trajets-termines");
}
// =============================
// WALLETS + AJUSTEMENT
// =============================
async function chargerWallets() {
    const zone = document.getElementById("section-wallets");
    const res = await fetch("/admin/wallets");
    const wallets = await res.json();

    zone.innerHTML = "";

    wallets.forEach(w => {
        zone.innerHTML += `
            <div class="trajet-card">
                <h4>${w.nom_utilisateur}</h4>

                <p><strong>Email :</strong> ${w.email}</p>
                <p><strong>Solde :</strong> ${w.solde_argent}$</p>

                <div class="home-actions">
                    <button class="btn" onclick="ajusterWallet(${w.id_wallet})">
                        Ajuster solde
                    </button>
                </div>
            </div>
        `;
    });
}

// =============================
// ACTIONS ADMIN
// =============================
async function suspendreUtilisateur(id) {
    await fetch(`/admin/utilisateur/${id}/suspendre`, { method: "PUT" });
    chargerUtilisateurs();
}

async function reactiverUtilisateur(id) {
    await fetch(`/admin/utilisateur/${id}/reactiver`, { method: "PUT" });
    chargerUtilisateurs();
}

async function accepterDemande(id) {
    await fetch(`/admin/demande/${id}/accepter`, { method: "PUT" });
    chargerDemandes();
    chargerUtilisateurs();
}

async function refuserDemande(id) {
    const commentaire = prompt("Raison du refus :") || "Refusé";
    await fetch(`/admin/demande/${id}/refuser`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ commentaire_admin: commentaire })
    });
    chargerDemandes();
}

// 💳 AJUSTEMENT WALLET
async function ajusterWallet(id_wallet) {
    const montant = prompt("Montant (+ ajouter / - retirer) :");
    const description = prompt("Description :") || "Ajustement admin";

    await fetch(`/admin/wallet/${id_wallet}/ajuster`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            montant_argent: montant,
            montant_points: 0,
            description: description
        })
    });

    alert("✅ Wallet mis à jour");
    chargerWallets();
}

// =============================
// INIT
// =============================
async function initAdmin() {
    const ok = await verifierAdmin();
    if (!ok) return;

    await chargerStatsAdmin();
    await chargerUtilisateurs();
    await chargerDemandes();
    await chargerTrajetsAdmin();
    await chargerWallets();
}

document.addEventListener("DOMContentLoaded", initAdmin);

</script>
{% endblock %}
