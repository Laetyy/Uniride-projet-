{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Connexion</h1>

        <div class="social-buttons">
            <div class="social-btn">Continuer avec Google</div>
            <div class="social-btn">Continuer avec Apple</div>
            <div class="social-btn">Continuer avec Facebook</div>
        </div>

        <form id="loginForm" class="form-block">
            <label for="identifiant">Nom utilisateur / Email / Téléphone</label>
            <input type="text" id="identifiant" placeholder="Entre ton identifiant" required>

            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" placeholder="Entre ton mot de passe" required>

            <button type="submit" class="btn">Se connecter</button>
        </form>

        <p id="message"></p>
        <a class="muted-link" href="/register-page">Créer un compte</a>
    </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    const loginBtn = e.target.querySelector("button");
    const originalText = loginBtn.textContent;
    loginBtn.disabled = true;
    loginBtn.textContent = "Chargement...";

    setTimeout(() => {
        const user = JSON.parse(localStorage.getItem("user"));
        if (user) {
            window.location.href = "/home";
        } else {
            loginBtn.disabled = false;
            loginBtn.textContent = originalText;
        }
    }, 500);
});
</script>
{% endblock %}
