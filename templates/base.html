<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniRide</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <h1>🚗 UNIRIDE</h1>

        <div class="nav-links">
            <a href="/home">Accueil</a>
            <a href="/trajets-page" class="nav-connected">Trouver un trajet</a>
            <a href="/conducteur-page" class="nav-connected">Publier un trajet</a>
            <a href="/mes-reservations-page" class="nav-connected">Mes réservations</a>

            <!-- 🔥 PROFIL -->
            <a href="/profil-page" class="nav-connected nav-profil">Profil</a>

            <!-- 🔥 ADMIN -->
            <a href="/admin-page" class="nav-connected nav-admin">Admin</a>

            <a href="/login-page" class="nav-disconnected">Connexion</a>
            <a href="/register-page" class="nav-disconnected">Inscription</a>

            <a href="#" id="logout-link" class="nav-connected">Déconnexion</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- HELP -->
    <div id="help-box" class="hidden help-overlay">
        <div class="help-content">
            <h3>💡 Besoin d’aide ?</h3>

            <div id="contact-info" style="display:none;">
                <p>📞 +1800 800 8080</p>
                <p>📧 support@uniride.ca</p>
            </div>

            <button class="btn" onclick="showContact()">Contacter le support</button>
            <button class="btn secondary" onclick="closeHelp()">Fermer</button>
        </div>
    </div>

    <button id="help-floating-btn" onclick="openHelp()">?</button>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            async function syncUserFromSession() {
                try {
                    const response = await fetch("/me");
                    const data = await response.json();

                    if (response.ok && data.user) {
                        localStorage.setItem("user", JSON.stringify(data.user));
                        return data.user;
                    } else {
                        localStorage.removeItem("user");
                        return null;
                    }
                } catch (error) {
                    console.error("Erreur sync session :", error);
                    localStorage.removeItem("user");
                    return null;
                }
            }

            function updateNavbar(user) {
                const connectedLinks = document.querySelectorAll(".nav-connected");
                const disconnectedLinks = document.querySelectorAll(".nav-disconnected");
                const adminLinks = document.querySelectorAll(".nav-admin");
                const profilLinks = document.querySelectorAll(".nav-profil");

                if (user) {
                    connectedLinks.forEach(link => link.style.display = "inline-block");
                    disconnectedLinks.forEach(link => link.style.display = "none");

                    if (user.role === "admin") {
                        // ✅ admin voit admin
                        adminLinks.forEach(link => link.style.display = "inline-block");

                        // ❌ admin ne voit pas profil
                        profilLinks.forEach(link => link.style.display = "none");

                    } else {
                        // ❌ user normal ne voit pas admin
                        adminLinks.forEach(link => link.style.display = "none");

                        // ✅ user voit profil
                        profilLinks.forEach(link => link.style.display = "inline-block");
                    }

                } else {
                    connectedLinks.forEach(link => link.style.display = "none");
                    disconnectedLinks.forEach(link => link.style.display = "inline-block");
                    adminLinks.forEach(link => link.style.display = "none");
                    profilLinks.forEach(link => link.style.display = "none");
                }
            }

            async function logout() {
                try {
                    await fetch("/logout", { method: "POST" });
                } catch (error) {
                    console.error("Erreur logout :", error);
                }

                localStorage.removeItem("user");
                window.location.href = "/home";
            }

            const logoutLink = document.getElementById("logout-link");

            if (logoutLink) {
                logoutLink.addEventListener("click", async function (e) {
                    e.preventDefault();
                    await logout();
                });
            }

            syncUserFromSession().then(user => {
                updateNavbar(user);
            });
        });

        function openHelp() {
            document.getElementById("help-box").classList.add("active");
        }

        function closeHelp() {
            document.getElementById("help-box").classList.remove("active");
            document.getElementById("contact-info").style.display = "none";
        }

        function showContact() {
            document.getElementById("contact-info").style.display = "block";
        }
    </script>
</body>
</html>
