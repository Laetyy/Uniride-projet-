{% extends "base.html" %}

{% block content %}
<h2>Espace Conducteur</h2>

<div id="conducteur-container"></div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
const container = document.getElementById("conducteur-container");

function renderNotConnected() {
    container.innerHTML = `
        <div class="dashboard-card">
            <h3>Accès refusé</h3>
            <p>Vous devez être connecté pour accéder à cette page.</p>
            <a class="btn" href="/login-page">Se connecter</a>
        </div>
    `;
}

function renderBecomeDriver(refusInfo = null) {
    let refusBlock = "";

    if (refusInfo) {
        refusBlock = `
            <div class="notice-box" style="margin-bottom: 20px;">
                <h3>Demande refusée</h3>
                <p><strong>Statut :</strong> refusee</p>
                <p><strong>Commentaire admin :</strong> ${refusInfo.commentaire_admin || "Aucun commentaire"}</p>
                <p>Vous pouvez corriger vos informations et envoyer une nouvelle demande.</p>
            </div>
        `;
    }

    container.innerHTML = `
        <div class="dashboard-card">
            ${refusBlock}

            <h3>Devenir conducteur</h3>
            <p>Commencez par remplir les informations du véhicule.</p>

            <form id="step1Form">
                <label>Marque / Modèle</label>
                <input type="text" id="modele" placeholder="Ex: Toyota Corolla" required>

                <label>Type de véhicule</label>
                <input type="text" id="type_vehicule" placeholder="Ex: Berline" required>

                <label>Couleur</label>
                <input type="text" id="couleur" placeholder="Ex: Noir">

                <label>Année</label>
                <input type="number" id="annee" placeholder="Ex: 2020">

                <label>Plaque d'immatriculation</label>
                <input type="text" id="plaque_immatriculation" placeholder="Ex: ABC123" required>

                <button type="submit" class="btn">Confirmer les informations</button>
            </form>

            <div id="identity-step" style="display:none; margin-top:20px;">
                <h3>Vérification de l'identité</h3>
                <p>Veuillez maintenant compléter la vérification de votre identité.</p>

                <form id="step2Form">
                    <label>Numéro de permis</label>
                    <input type="text" id="numero_permis" placeholder="Ex: P123456789" required>

                    <label>Date d'expiration du permis</label>
                    <input type="date" id="date_expiration_permis" required>

                    <label>Type de pièce d'identité</label>
                    <select id="type_identite" required>
                        <option value="">Choisir</option>
                        <option value="passeport">Passeport</option>
                        <option value="assurance_maladie">Carte d'assurance maladie</option>
                    </select>

                    <label>Numéro de la pièce d'identité</label>
                    <input type="text" id="numero_identite" placeholder="Numéro du document" required>

                    <label>Date d'expiration de la pièce d'identité</label>
                    <input type="date" id="date_expiration_identite" required>

                    <button type="submit" class="btn">Envoyer la demande</button>
                </form>
            </div>
        </div>
    `;

    let vehiculeData = {};

    document.getElementById("step1Form").addEventListener("submit", function (e) {
        e.preventDefault();

        vehiculeData = {
            modele: document.getElementById("modele").value.trim(),
            type_vehicule: document.getElementById("type_vehicule").value.trim(),
            couleur: document.getElementById("couleur").value.trim(),
            annee: document.getElementById("annee").value,
            plaque_immatriculation: document.getElementById("plaque_immatriculation").value.trim()
        };

        document.getElementById("identity-step").style.display = "block";
        document.getElementById("identity-step").scrollIntoView({ behavior: "smooth" });
    });

    document.getElementById("step2Form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const data = {
            id_utilisateur: user.id_utilisateur,
            ...vehiculeData,
            numero_permis: document.getElementById("numero_permis").value.trim(),
            date_expiration_permis: document.getElementById("date_expiration_permis").value,
            type_identite: document.getElementById("type_identite").value,
            numero_identite: document.getElementById("numero_identite").value.trim(),
            date_expiration_identite: document.getElementById("date_expiration_identite").value
        };

        try {
            const response = await fetch("/conducteur/demande", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                container.innerHTML = `
                    <div class="dashboard-card">
                        <h3>Demande en traitement</h3>
                        <p>Votre demande de certification a bien été envoyée.</p>
                        <p>Elle est actuellement en cours de traitement par l'administration.</p>
                        <p><strong>Statut :</strong> en_attente</p>
                    </div>
                `;
            } else {
                alert("❌ " + (result.error || "Erreur"));
            }
        } catch (error) {
            console.error(error);
            alert("Erreur serveur");
        }
    });
}

async function renderPendingDriver() {
    try {
        const response = await fetch(`/conducteur/statut/${user.id_utilisateur}`);
        const result = await response.json();

        container.innerHTML = `
            <div class="dashboard-card">
                <h3>Demande en attente</h3>
                <p>Votre demande de certification a été soumise.</p>
                <p><strong>Statut :</strong> ${result.statut || "en_attente"}</p>
                <p><strong>Permis :</strong> ${result.numero_permis || ""}</p>
                <p><strong>Expiration permis :</strong> ${result.date_expiration_permis || ""}</p>
                <p><strong>Type d'identité :</strong> ${result.type_identite || ""}</p>
                <p><strong>Numéro identité :</strong> ${result.numero_identite || ""}</p>
                <p><strong>Expiration identité :</strong> ${result.date_expiration_identite || ""}</p>
                <p><strong>Commentaire admin :</strong> ${result.commentaire_admin || "En attente de traitement"}</p>
            </div>
        `;
    } catch (error) {
        console.error(error);
        container.innerHTML = "<p>Erreur lors du chargement du statut.</p>";
    }
}

async function chargerVehiculeConducteur() {
    try {
        const response = await fetch(`/conducteur/vehicule/${user.id_utilisateur}`);
        const vehicule = await response.json();

        const vehiculeInput = document.getElementById("vehicule");
        const idVehiculeInput = document.getElementById("id_vehicule");

        if (!vehiculeInput || !idVehiculeInput) return;

        if (!response.ok) {
            vehiculeInput.value = "Aucun véhicule enregistré";
            idVehiculeInput.value = "";
            return;
        }

        let labelVehicule = vehicule.modele || "Véhicule enregistré";

        if (vehicule.annee) {
            labelVehicule += ` ${vehicule.annee}`;
        }

        if (vehicule.couleur) {
            labelVehicule += ` - ${vehicule.couleur}`;
        }

        vehiculeInput.value = labelVehicule;
        idVehiculeInput.value = vehicule.id_vehicule;

    } catch (error) {
        console.error(error);
        const vehiculeInput = document.getElementById("vehicule");
        if (vehiculeInput) {
            vehiculeInput.value = "Erreur de chargement du véhicule";
        }
    }
}

async function chargerVillesDansSelects() {
    try {
        const response = await fetch("/villes");
        const villes = await response.json();

        const departSelect = document.getElementById("id_ville_depart");
        const arriveeSelect = document.getElementById("id_ville_arrivee");

        if (!departSelect || !arriveeSelect) return;

        if (!response.ok) {
            departSelect.innerHTML = `<option value="">Erreur chargement villes</option>`;
            arriveeSelect.innerHTML = `<option value="">Erreur chargement villes</option>`;
            return;
        }

        const villesAutorisees = [
            "Montreal",
            "Quebec",
            "Laval",
            "Gatineau",
            "Sherbrooke",
            "Trois-Rivieres",
            "Ottawa",
            "Toronto",
            "Mississauga",
            "Brampton",
            "Vancouver",
            "Surrey",
            "Burnaby",
            "Calgary",
            "Edmonton",
            "Winnipeg",
            "Halifax",
            "Saskatoon",
            "Regina",
            "St. John's"
        ];

        const villesFiltrees = villes.filter(ville =>
            villesAutorisees.includes(ville.nom_ville)
        );

        departSelect.innerHTML = `<option value="">Choisir une ville</option>`;
        arriveeSelect.innerHTML = `<option value="">Choisir une ville</option>`;

        villesFiltrees.forEach(ville => {
            const nomsAffiches = {
                "Montreal": "Montréal",
                "Quebec": "Quebec",
                "Trois-Rivieres": "Trois-Rivières"
            };

            const label = nomsAffiches[ville.nom_ville] || ville.nom_ville;

            const optionDepart = document.createElement("option");
            optionDepart.value = ville.id_ville;
            optionDepart.textContent = label;

            const optionArrivee = document.createElement("option");
            optionArrivee.value = ville.id_ville;
            optionArrivee.textContent = label;

            departSelect.appendChild(optionDepart);
            arriveeSelect.appendChild(optionArrivee);
        });

    } catch (error) {
        console.error(error);
    }
}

async function terminerTrajet(id_trajet) {
    const confirmation = confirm("Confirmer que ce trajet est bien terminé ?");

    if (!confirmation) return;

    try {
        const response = await fetch(`/conducteur/trajet/${id_trajet}/terminer`, {
            method: "PUT"
        });

        const result = await response.json();

        if (response.ok) {
            alert(`✅ ${result.message}\nMontant reçu : ${result.montant_recu} $`);
            chargerMesTrajets();
            chargerReservationsConducteur();
        } else {
            alert("❌ " + (result.error || "Erreur"));
        }
    } catch (error) {
        console.error(error);
        alert("Erreur serveur");
    }
}

function renderDriverDashboard() {
    container.innerHTML = `
        <div class="dashboard-conducteur">
            <div class="dashboard-card trip-form-section">
                <h3>Publier un trajet</h3>
                <p class="subtitle">Proposez votre trajet et remplissez vos places disponibles.</p>

                <form id="trajetForm" class="trip-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="id_ville_depart">Ville de départ</label>
                            <select id="id_ville_depart" required>
                                <option value="">Chargement des villes...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="id_ville_arrivee">Ville d'arrivée</label>
                            <select id="id_ville_arrivee" required>
                                <option value="">Chargement des villes...</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="vehicule">Véhicule enregistré</label>
                        <input type="text" id="vehicule" placeholder="Chargement du véhicule..." readonly>
                        <input type="hidden" id="id_vehicule">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="date_trajet">Date</label>
                            <input type="date" id="date_trajet" required>
                        </div>

                        <div class="form-group">
                            <label for="heure_trajet">Heure</label>
                            <input type="time" id="heure_trajet" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="prix">Prix par place</label>
                            <input type="number" id="prix" step="0.01" min="0" placeholder="Ex : 25.00" required>
                        </div>

                        <div class="form-group">
                            <label for="places_disponibles">Places disponibles</label>
                            <select id="places_disponibles" required>
                                <option value="">Choisir</option>
                                <option value="1">1 place</option>
                                <option value="2">2 places</option>
                                <option value="3">3 places</option>
                                <option value="4">4 places</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="ambiance">Ambiance</label>
                        <select id="ambiance" required>
                            <option value="calme">Calme</option>
                            <option value="dynamique">Dynamique</option>
                        </select>
                    </div>

                    <div class="options-box">
                        <p class="options-title">Préférences du trajet</p>

                        <label class="checkbox-item">
                            <input type="checkbox" id="musique">
                            <span>Musique autorisée</span>
                        </label>

                        <label class="checkbox-item">
                            <input type="checkbox" id="telephone_autorise">
                            <span>Appels autorisés</span>
                        </label>
                    </div>

                    <button type="submit" class="btn publish-btn">Publier le trajet</button>
                </form>
            </div>

            <div class="dashboard-card">
                <h3>Mes trajets actifs</h3>
                <div id="mes-trajets-actifs">
                    <p>Aucun trajet actif pour le moment.</p>
                </div>
            </div>

            <div class="dashboard-card">
                <h3>Historique de mes trajets</h3>
                <div id="historique-trajets">
                    <p>Aucun trajet terminé pour le moment.</p>
                </div>
            </div>

            <div class="dashboard-card">
                <h3>Réservations reçues</h3>
                <div id="reservations-recues">
                    <p>Aucune réservation reçue pour le moment.</p>
                </div>
            </div>
        </div>
    `;

    document.getElementById("trajetForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const data = {
            id_conducteur: user.id_utilisateur,
            id_ville_depart: document.getElementById("id_ville_depart").value,
            id_ville_arrivee: document.getElementById("id_ville_arrivee").value,
            id_vehicule: document.getElementById("id_vehicule").value,
            date_trajet: document.getElementById("date_trajet").value,
            heure_trajet: document.getElementById("heure_trajet").value,
            prix: document.getElementById("prix").value,
            places_disponibles: document.getElementById("places_disponibles").value,
            ambiance: document.getElementById("ambiance").value,
            musique: document.getElementById("musique").checked,
            telephone_autorise: document.getElementById("telephone_autorise").checked
        };

        if (data.id_ville_depart === data.id_ville_arrivee) {
            alert("❌ La ville de départ et la ville d'arrivée doivent être différentes.");
            return;
        }

        if (!data.id_vehicule) {
            alert("❌ Aucun véhicule enregistré n'est disponible pour publier ce trajet.");
            return;
        }

        try {
            const response = await fetch("/trajets", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                alert("✅ Trajet publié avec succès");
                document.getElementById("trajetForm").reset();
                chargerVehiculeConducteur();
                chargerVillesDansSelects();
                chargerMesTrajets();
                chargerReservationsConducteur();
            } else {
                alert("❌ " + (result.error || "Erreur"));
            }
        } catch (error) {
            console.error(error);
            alert("Erreur serveur");
        }
    });

    chargerVehiculeConducteur();
    chargerVillesDansSelects();
    chargerMesTrajets();
    chargerReservationsConducteur();
}

async function chargerMesTrajets() {
    const zoneActifs = document.getElementById("mes-trajets-actifs");
    const zoneHistorique = document.getElementById("historique-trajets");

    try {
        const response = await fetch(`/conducteur/trajets/${user.id_utilisateur}`);
        const trajets = await response.json();

        if (!response.ok) {
            zoneActifs.innerHTML = `<p>Erreur : ${trajets.error}</p>`;
            zoneHistorique.innerHTML = `<p>Erreur : ${trajets.error}</p>`;
            return;
        }

        const trajetsActifs = trajets.filter(t => t.statut !== "termine");
        const trajetsHistoriques = trajets.filter(t => t.statut === "termine");

        zoneActifs.innerHTML = "";
        zoneHistorique.innerHTML = "";

        if (trajetsActifs.length === 0) {
            zoneActifs.innerHTML = "<p>Aucun trajet actif pour le moment.</p>";
        }

        if (trajetsHistoriques.length === 0) {
            zoneHistorique.innerHTML = "<p>Aucun trajet terminé pour le moment.</p>";
        }

        trajetsActifs.forEach(trajet => {
            const card = document.createElement("div");
            card.className = "trajet-card";

            card.innerHTML = `
                <h4>${trajet.ville_depart} → ${trajet.ville_arrivee}</h4>
                <p><strong>Véhicule :</strong> ${trajet.vehicule || "Non indiqué"}</p>
                <p><strong>Date :</strong> ${trajet.date_trajet}</p>
                <p><strong>Heure :</strong> ${trajet.heure_trajet}</p>
                <p><strong>Prix :</strong> ${trajet.prix}$</p>
                <p><strong>Places :</strong> ${trajet.places_disponibles}</p>
                <p><strong>Ambiance :</strong> ${trajet.ambiance}</p>
                <p><strong>Statut :</strong> ${trajet.statut}</p>
                <div class="home-actions">
                    <button class="btn" onclick="terminerTrajet(${trajet.id_trajet})">Terminer le trajet</button>
                </div>
            `;

            zoneActifs.appendChild(card);
        });

        trajetsHistoriques.forEach(trajet => {
            const card = document.createElement("div");
            card.className = "trajet-card";

            card.innerHTML = `
                <h4>${trajet.ville_depart} → ${trajet.ville_arrivee}</h4>
                <p><strong>Véhicule :</strong> ${trajet.vehicule || "Non indiqué"}</p>
                <p><strong>Date :</strong> ${trajet.date_trajet}</p>
                <p><strong>Heure :</strong> ${trajet.heure_trajet}</p>
                <p><strong>Prix :</strong> ${trajet.prix}$</p>
                <p><strong>Statut :</strong> ${trajet.statut}</p>
                <p class="small-text">Trajet archivé dans l'historique ✅</p>
            `;

            zoneHistorique.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        zoneActifs.innerHTML = "<p>Erreur lors du chargement des trajets.</p>";
        zoneHistorique.innerHTML = "<p>Erreur lors du chargement de l'historique.</p>";
    }
}

async function chargerReservationsConducteur() {
    const zone = document.getElementById("reservations-recues");

    if (!zone || !user) return;

    try {
        const response = await fetch(`/reservations-conducteur/${user.id_utilisateur}`);
        const reservations = await response.json();

        if (!response.ok) {
            zone.innerHTML = `<p>Erreur : ${reservations.error}</p>`;
            return;
        }

        if (reservations.length === 0) {
            zone.innerHTML = "<p>Aucune réservation reçue pour le moment.</p>";
            return;
        }

        zone.innerHTML = "";

        reservations.forEach(reservation => {
            const card = document.createElement("div");
            card.className = "trajet-card";

            const badgeHtml = Number(reservation.messages_non_lus || 0) > 0
                ? `<span class="message-badge">${reservation.messages_non_lus}</span>`
                : "";

            card.innerHTML = `
                <h4>${reservation.depart} → ${reservation.arrivee}</h4>
                <p><strong>Passager :</strong> ${reservation.passager}</p>
                <p><strong>Date :</strong> ${reservation.date_trajet}</p>
                <p><strong>Heure :</strong> ${reservation.heure_trajet}</p>
                <p><strong>Places réservées :</strong> ${reservation.nb_places}</p>
                <p><strong>Statut réservation :</strong> ${reservation.statut}</p>
                <p><strong>Statut trajet :</strong> ${reservation.statut_trajet}</p>
                <div class="home-actions">
                    <button class="btn message-btn" onclick="ouvrirChat(${reservation.id_trajet})">
                        💬 Contacter
                        ${badgeHtml}
                    </button>
                </div>
            `;

            zone.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        zone.innerHTML = "<p>Erreur lors du chargement des réservations reçues.</p>";
    }
}

async function initConducteurPage() {
    if (!user) {
        renderNotConnected();
        return;
    }

    if (user.role === "conducteur") {
        renderDriverDashboard();
        return;
    }

    try {
        const response = await fetch(`/conducteur/statut/${user.id_utilisateur}`);
        const result = await response.json();

        if (result.statut === "en_attente") {
            renderPendingDriver();
        } else if (result.statut === "refusee") {
            renderBecomeDriver(result);
        } else if (result.statut === "acceptee") {
            user.role = "conducteur";
            localStorage.setItem("user", JSON.stringify(user));
            renderDriverDashboard();
        } else {
            renderBecomeDriver();
        }
    } catch (error) {
        console.error(error);
        renderBecomeDriver();
    }
}

function ouvrirChat(id_trajet) {
    window.location.href = `/conversation-page?trajet=${id_trajet}`;
}
window.addEventListener("pageshow", function () {
    if (user) {
        setTimeout(() => {
            chargerReservationsConducteur();
        }, 300);
    }
});
initConducteurPage();
</script>
{% endblock %}
