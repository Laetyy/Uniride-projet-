{% extends "base.html" %}

{% block content %}
<h2>Espace Conducteur</h2>

<div id="conducteur-container"></div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
const container = document.getElementById("conducteur-container");

function renderNotConnected() {
    container.innerHTML = `
        <div class="dashboard-card">
            <h3>Accès refusé</h3>
            <p>Vous devez être connecté pour accéder à cette page.</p>
            <a class="btn" href="/login-page">Se connecter</a>
        </div>
    `;
}

function renderBecomeDriver() {
    container.innerHTML = `
        <div class="dashboard-card">
            <h3>Devenir conducteur</h3>
            <p>Vous n’êtes pas encore conducteur. Remplissez ce formulaire pour soumettre votre demande de certification.</p>

            <form id="certificationForm">
                <label>Numéro de permis</label>
                <input type="text" id="numero_permis" placeholder="Ex: P123456789">

                <label>Marque / Modèle</label>
                <input type="text" id="modele" placeholder="Ex: Toyota Corolla">

                <label>Type de véhicule</label>
                <input type="text" id="type_vehicule" placeholder="Ex: Berline">

                <label>Couleur</label>
                <input type="text" id="couleur" placeholder="Ex: Noir">

                <label>Année</label>
                <input type="number" id="annee" placeholder="Ex: 2020">

                <label>Plaque d'immatriculation</label>
                <input type="text" id="plaque_immatriculation" placeholder="Ex: ABC123">

                <button type="submit" class="btn">Envoyer la demande</button>
            </form>
        </div>
    `;

    document.getElementById("certificationForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const data = {
            id_utilisateur: user.id_utilisateur,
            numero_permis: document.getElementById("numero_permis").value,
            modele: document.getElementById("modele").value,
            type_vehicule: document.getElementById("type_vehicule").value,
            couleur: document.getElementById("couleur").value,
            annee: document.getElementById("annee").value,
            plaque_immatriculation: document.getElementById("plaque_immatriculation").value
        };

        try {
            const response = await fetch("/conducteur/demande", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                alert("✅ Demande envoyée avec succès");
                renderPendingDriver();
            } else {
                alert("❌ " + (result.error || "Erreur"));
            }
        } catch (error) {
            console.error(error);
            alert("Erreur serveur");
        }
    });
}

async function renderPendingDriver() {
    try {
        const response = await fetch(`/conducteur/statut/${user.id_utilisateur}`);
        const result = await response.json();

        container.innerHTML = `
            <div class="dashboard-card">
                <h3>Demande en attente</h3>
                <p>Votre demande de certification a été soumise.</p>
                <p><strong>Statut :</strong> ${result.statut || "en_attente"}</p>
                <p><strong>Permis :</strong> ${result.numero_permis || ""}</p>

                <button class="btn" id="simulateAccept">Simuler validation admin</button>
            </div>
        `;

        document.getElementById("simulateAccept").addEventListener("click", async function () {
            const res = await fetch(`/conducteur/simuler-validation/${user.id_utilisateur}`, {
                method: "POST"
            });

            const data = await res.json();

            if (res.ok) {
                user.role = "conducteur";
                localStorage.setItem("user", JSON.stringify(user));
                alert("✅ Conducteur validé");
                renderDriverDashboard();
            } else {
                alert("❌ " + (data.error || "Erreur"));
            }
        });

    } catch (error) {
        console.error(error);
        container.innerHTML = "<p>Erreur lors du chargement du statut.</p>";
    }
}

function renderDriverDashboard() {
    container.innerHTML = `
        <div class="dashboard-conducteur">
            <div class="dashboard-card">
                <h3>Publier un trajet</h3>

                <form id="trajetForm">
                    <label>ID ville de départ</label>
                    <input type="number" id="id_ville_depart" placeholder="Ex: 1">

                    <label>ID ville d'arrivée</label>
                    <input type="number" id="id_ville_arrivee" placeholder="Ex: 2">

                    <label>ID véhicule</label>
                    <input type="number" id="id_vehicule" placeholder="Ex: 1">

                    <label>Date</label>
                    <input type="date" id="date_trajet">

                    <label>Heure</label>
                    <input type="time" id="heure_trajet">

                    <label>Prix</label>
                    <input type="number" id="prix" placeholder="Prix">

                    <label>Places disponibles</label>
                    <input type="number" id="places_disponibles" placeholder="Places disponibles">

                    <label>Ambiance</label>
                    <select id="ambiance">
                        <option value="calme">Calme</option>
                        <option value="dynamique">Dynamique</option>
                    </select>

                    <label>Musique</label>
                    <select id="musique">
                        <option value="true">Oui</option>
                        <option value="false">Non</option>
                    </select>

                    <label>Téléphone autorisé</label>
                    <select id="telephone_autorise">
                        <option value="true">Oui</option>
                        <option value="false">Non</option>
                    </select>

                    <button type="submit" class="btn">Publier le trajet</button>
                </form>
            </div>

            <div class="dashboard-card">
                <h3>Mes trajets publiés</h3>
                <div id="mes-trajets">
                    <p>Aucun trajet publié pour le moment.</p>
                </div>
            </div>

            <div class="dashboard-card">
                <h3>Réservations reçues</h3>
                <div id="reservations-recues">
                    <p>Aucune réservation reçue pour le moment.</p>
                </div>
            </div>
        </div>
    `;

    document.getElementById("trajetForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const data = {
            id_conducteur: user.id_utilisateur,
            id_ville_depart: document.getElementById("id_ville_depart").value,
            id_ville_arrivee: document.getElementById("id_ville_arrivee").value,
            id_vehicule: document.getElementById("id_vehicule").value,
            date_trajet: document.getElementById("date_trajet").value,
            heure_trajet: document.getElementById("heure_trajet").value,
            prix: document.getElementById("prix").value,
            places_disponibles: document.getElementById("places_disponibles").value,
            ambiance: document.getElementById("ambiance").value,
            musique: document.getElementById("musique").value === "true",
            telephone_autorise: document.getElementById("telephone_autorise").value === "true"
        };

        try {
            const response = await fetch("/trajets", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                alert("✅ Trajet publié avec succès");
                document.getElementById("trajetForm").reset();
                chargerMesTrajets();
            } else {
                alert("❌ " + (result.error || "Erreur"));
            }
        } catch (error) {
            console.error(error);
            alert("Erreur serveur");
        }
        chargerMesTrajets();
    });
}
async function chargerMesTrajets() {
    const zone = document.getElementById("mes-trajets");

    try {
        const response = await fetch(`/conducteur/trajets/${user.id_utilisateur}`);
        const trajets = await response.json();

        if (!response.ok) {
            zone.innerHTML = `<p>Erreur : ${trajets.error}</p>`;
            return;
        }

        if (trajets.length === 0) {
            zone.innerHTML = "<p>Aucun trajet publié pour le moment.</p>";
            return;
        }

        zone.innerHTML = "";

        trajets.forEach(trajet => {
            const card = document.createElement("div");
            card.className = "trajet-card";

            card.innerHTML = `
                <h4>${trajet.ville_depart} → ${trajet.ville_arrivee}</h4>
                <p><strong>Date :</strong> ${trajet.date_trajet}</p>
                <p><strong>Heure :</strong> ${trajet.heure_trajet}</p>
                <p><strong>Prix :</strong> ${trajet.prix}$</p>
                <p><strong>Places :</strong> ${trajet.places_disponibles}</p>
                <p><strong>Ambiance :</strong> ${trajet.ambiance}</p>
                <p><strong>Statut :</strong> ${trajet.statut}</p>
            `;

            zone.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        zone.innerHTML = "<p>Erreur lors du chargement des trajets.</p>";
    }
}

async function initConducteurPage() {
    if (!user) {
        renderNotConnected();
        return;
    }

    if (user.role === "conducteur") {
        renderDriverDashboard();
        return;
    }

    try {
        const response = await fetch(`/conducteur/statut/${user.id_utilisateur}`);
        const result = await response.json();

        if (result.statut === "en_attente" || result.statut === "refusee") {
            renderPendingDriver();
        } else if (result.statut === "acceptee") {
            user.role = "conducteur";
            localStorage.setItem("user", JSON.stringify(user));
            renderDriverDashboard();
        } else {
            renderBecomeDriver();
        }
    } catch (error) {
        console.error(error);
        renderBecomeDriver();
    }
}

initConducteurPage();
</script>
{% endblock %}
